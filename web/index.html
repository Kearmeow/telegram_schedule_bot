<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Расписание</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <div class="eyebrow">UNIVERSITY</div>
        <h1>📚 Расписание</h1>
      </div>
      <button id="adminButton" class="icon-btn hidden" title="Админка">⚙️</button>
    </header>

    <section class="card">
      <label for="groupSelect">Группа</label>
      <select id="groupSelect"></select>
    </section>

    <section class="days" id="days"></section>

    <section id="schedule"></section>

    <section id="adminPanel" class="admin hidden">
      <div class="admin-header">
        <h2>⚙️ Админка</h2>
        <button id="closeAdmin" class="secondary">Закрыть</button>
      </div>

      <div class="card">
        <h3>Новая группа</h3>
        <div class="row">
          <input id="newGroupName" placeholder="Например, ИВТ-21">
          <button id="addGroup" class="primary">Добавить</button>
        </div>
      </div>

      <div class="card">
        <h3>Управление расписанием</h3>
        <div class="form-grid">
          <select id="adminGroup"></select>
          <select id="lessonDay">
            <option value="1">Понедельник</option>
            <option value="2">Вторник</option>
            <option value="3">Среда</option>
            <option value="4">Четверг</option>
            <option value="5">Пятница</option>
            <option value="6">Суббота</option>
            <option value="7">Воскресенье</option>
          </select>
          <input id="startTime" type="time" value="09:00">
          <input id="endTime" type="time" value="10:30">
          <input id="subject" placeholder="Предмет">
          <input id="teacher" placeholder="Преподаватель">
          <input id="room" placeholder="Аудитория">
          <input id="notes" placeholder="Заметка (необязательно)">
        </div>
        <button id="addLesson" class="primary full">Добавить занятие</button>
      </div>

      <div class="card">
        <h3>Занятия группы</h3>
        <div id="adminLessons"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
